[package]
name = "rustty"
version = "0.7.0"
edition = "2024"
rust-version = "1.99.1"
description = "A fast, native-feeling, MIT-licensed terminal emulator for Windows (spec: docs/SPEC.md)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dhruvparpia/rustty"
homepage = "https://github.com/dhruvparpia/rustty"
keywords = ["terminal", "terminal-emulator", "windows", "conpty", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Recovery",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
# Vector2 for Direct2D drawing calls (windows 0.62 does not re-export it).
windows-numerics = "0.3.1"
# The `#[implement]` macro expands to `::windows_core::` paths (WIN-007),
# so windows-core must be a direct dependency; same version the `windows`
# crate pulls in.
windows-core = "0.62.2"

# The render bench captures presented frames with `PrintWindow`, which
# windows 0.62 classifies under Win32_Storage_Xps. Tests only: the shipped
# binary never references it.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Storage_Xps"] }

[build-dependencies]
# Unconditional: build scripts compile for the host, and main() gates the
# embed on the TARGET (cross-checks to Linux must skip the resource compiler).
winresource = "0.1.34"

# Session host (issue #46, docs/design-session-host.md): a separate
# executable beside rustty.exe so host-owned shells outlive every
# client. GUI subsystem: the host must never flash a console window.
[[bin]]
name = "rustty-host"
path = "src/bin/rustty-host.rs"

[lints.rust]
missing_docs = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
