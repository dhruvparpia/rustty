# rusttyterm config — %APPDATA%\rusttyterm\config.toml
# (portable mode: a `config.toml` next to rusttyterm.exe wins)
#
# The app re-reads this file when you save it (CONFIG-018): themes, colours,
# fonts, window padding, split, tab bar, cursor, opacity, key bindings, bell
# mode, search defaults and profiles apply without restarting a shell.
# `scrollback` and `starting-profile` only affect the next tab. A file that does
# not parse is reported on stderr and the running config is kept.
#
# Every key below is optional; the defaults shown are what the app uses when
# the file or a key is missing. Unknown keys are rejected with an error at
# startup (no silent clamps: a bad value is an error, not a surprise). Keep
# the plain keys above the first `[section]` header — in TOML a key written
# after a header belongs to that section.
#
# Not read from config yet: window position, maximized/fullscreen start,
# initial directories, session restore.

# ---------------------------------------------------------------------------
# Plain keys — write these before any `[section]` header.
# ---------------------------------------------------------------------------

# Theme preset. Known: predawn, catppuccin-mocha, gruvbox-dark, one-dark,
# solarized-dark. An unknown name warns and falls back to predawn. A [theme]
# table (below) can name a theme file and override single colors.
theme = "predawn"

# Font family, as installed on the system.
font = "Cascadia Mono"

# Size in points, 5..72.
font-size = 11

# Line height as a multiple of the font's natural height, 0.5..4.0.
line-height = 1.25

# Extra font features (OTF tags): "calt=0" or "calt 0" turns one off, a bare
# comma list like "calt,liga" turns those on. These go after the ligatures
# switch below, so they win.
font-features = "calt,liga"

# Turn font ligatures on or off (SPEC-006, FONT-010/011). Ligature text is
# shaped as runs, which is slower to paint than the per-cell glyph cache the
# terminal uses when this is false.
ligatures = true

# Rows of scrollback per tab, 0..1_000_000.
scrollback = 10000

# Show the tab bar: always, auto (hide with one tab), hidden. A [tab-bar]
# table (below) carries the rest of the tab-bar options.
tab-bar = "auto"

# Profile used for the first tab (CONFIG-024, CONFIG-028).
starting-profile = "Git Bash"

# Window opacity, 10..100 (100 = solid).
opacity = 100

# Cursor: block | vertical-bar | underline, and whether it blinks.
cursor-shape = "block"
cursor-blink = true

# A left-drag release also copies the selection (CONFIG-008).
copy-on-select = true

# How a BEL is announced (BELL-002/006/007/008): "silent", "visual",
# "audible" (the default) or "both". A bell while the window is in the
# background also raises a Windows toast (BELL-005).
bell = "audible"

# Reopen the previous run's tabs, splits and window position at startup
# (TAB-026, WINDOW-015/016). Shells respawn in each pane's last reported
# directory; the file is `session.toml` beside `config.toml`.
session-restore = true

# ---------------------------------------------------------------------------
# Theme (CONFIG-002/003, THEME-009/013/014)
# ---------------------------------------------------------------------------
# `theme = "gruvbox-dark"` picks a preset: predawn, catppuccin-mocha,
# gruvbox-dark, one-dark, solarized-dark, solarized-light. With no `theme` key
# the app follows the Windows dark/light setting (THEME-010): light picks
# solarized-light, dark picks predawn.
#
# A [theme] table replaces the plain `theme` key. `name` picks the base: a
# preset, or the name of themes\<name>.toml beside this file (that file may
# set any of the keys below). Colors written here win over the file. Colors
# are "#RRGGBB", with or without the '#'; 3-digit forms, 0x prefixes and
# color names are rejected. An unknown key, a color that does not parse, and
# a palette that is not exactly 16 colors are reported and skipped, so a
# broken theme file never wrecks a window.
#
# [theme]
# name = "predawn"
# background = "#23212E"
# foreground = "#E7E7E7"
# cursor = "#E7E7E7"
# selection = "#44424F"
# search-highlight = "#FF7C36"
# tab-bar = "#1D1B26"
# tab-active = "#2C2A38"
# split-border = "#44424F"
# split-focus = "#FF7C36"
# palette = [
#   "#000000", "#D7005F", "#00BE6F", "#FF7C36",
#   "#28018F", "#B000AB", "#7C70FF", "#E7E7E7",
#   "#555555", "#F53084", "#10CF83", "#FFAF4B",
#   "#5442A3", "#AE21A9", "#66A6E3", "#FFFFFF",
# ]

# ---------------------------------------------------------------------------
# Key bindings (CONFIG-007, KEY-004..021)
# ---------------------------------------------------------------------------
# Modifiers: ctrl, shift, alt, super (Win is rejected: the terminal does not
# receive Win-key events). Keys include letters, digits, F1..F24, Enter, Tab,
# Esc, Backspace, Insert, Delete, Home, End, PageUp, PageDown, Up, Down, Left,
# Right, Space, Minus, Plus, Equals, comma.
#
# Actions:
#   new-tab, close-tab, next-tab, prev-tab, rename-tab, move-tab-left,
#   move-tab-right, split-vertical, split-horizontal, close-pane,
#   focus-next-pane, focus-prev-pane, focus-pane-1..4,
#   resize-pane-left/right/up/down, increase-font-size, decrease-font-size,
#   reset-font-size, next-theme, prev-theme, copy, paste, copy-paste, search,
#   clear-scrollback, toggle-fullscreen,
#   spawn-cmd, spawn-powershell, spawn-pwsh, spawn-git-bash, spawn-wsl
#
# Built-ins:
#   Ctrl+Shift+T=new-tab          Ctrl+Shift+W=close-tab
#   Ctrl+Shift+Right=next-tab     Ctrl+Shift+Left=prev-tab
#   Ctrl+Shift+D=split-vertical   Ctrl+Shift+S=split-horizontal
#   Ctrl+Shift+E=close-pane       Ctrl+Shift+Tab=focus-next-pane
#   Ctrl+Shift+1..4=focus-pane-1..4
#   Ctrl+Shift+Left/Right/Up/Down=resize-pane-left/right/up/down
#   Ctrl+Plus=increase-font-size  Ctrl+Minus=decrease-font-size
#   Ctrl+0=reset-font-size        Ctrl+Shift+C=copy  Ctrl+Shift+V=paste
#   Ctrl+Shift+X=copy-paste       Ctrl+K=clear-scrollback
#   Ctrl+F=search                 F11=toggle-fullscreen
#   Ctrl+Shift+F2=spawn-cmd       Ctrl+Shift+F3=spawn-powershell
#   Ctrl+Shift+F4=spawn-pwsh      Ctrl+Shift+F5=spawn-git-bash
#   Ctrl+Shift+F6=spawn-wsl       Ctrl+Shift+PageUp/Down=move-tab-left/right
#
# A binding below overrides the built-in for the same key.
#
# [keybindings]
# "Ctrl+Shift+T" = "new-tab"
# "Ctrl+Shift+Enter" = "split-vertical"
# "Alt+1" = "focus-pane-1"
# "Ctrl+Shift+J" = "next-theme"
# "Ctrl+Shift+R" = "rename-tab"
# "Ctrl+Shift+PageUp" = "move-tab-left"
# "Ctrl+Shift+PageDown" = "move-tab-right"

# ---------------------------------------------------------------------------
# Shell profiles (SHELL-017/019/021, CONFIG-023..028)
# ---------------------------------------------------------------------------
# The built-in list (cmd, PowerShell, pwsh, Git Bash, WSL) is always
# available; these entries are added to it, and an entry whose name matches a
# built-in replaces it. The Window menu lists every profile, and a
# `[profile]` (singular) table sets the one profile.
#
# [[profile]]
# name = "PowerShell"
# command = "pwsh"                    # executable, found on PATH if relative
# args = ["-NoLogo"]
# starting-directory = "%USERPROFILE%\\src"   # ~ and %VAR% expand; "" = inherit
# env = { RUST_LOG = "debug" }        # added to the inherited environment
# theme = "gruvbox-dark"              # preset name, or themes\<name>.toml
# tab-color = "#ff8800"               # accent stripe on the tab
# scrollback = 20000
# confirm-close = true         # TAB-018: ask before a tab of this profile closes
# font = "Consolas"                   # applied when a tab of this profile is
# font-size = 12                      # created, or when profiles are cycled:
# line-height = 1.2                   # one renderer serves the whole window,
                                      # so every tab follows the new metrics

# ---------------------------------------------------------------------------
# Search defaults (SEARCH-006/007/014)
# ---------------------------------------------------------------------------
# How the search strip starts up.
#
# [search]
# case-sensitive-default = false
# whole-word-default = false
# regex-default = false

# ---------------------------------------------------------------------------
# Splits (SPLIT-014, CONFIG-013)
# ---------------------------------------------------------------------------
#
# [split]
# border = true
# padding = 1     # pixel gap between panes; pane content is offset by it

# ---------------------------------------------------------------------------
# Quick terminal (roadmap v0.2: hotkey summon from screen edge)
# ---------------------------------------------------------------------------
# A frameless drop-down shell that spans the monitor's work area, summoned
# from any app by a system-wide hotkey. It hides instead of closing, so its
# shell survives every dismissal. Off by default: a global hotkey is
# invasive, so opt in.
#
# [quick-terminal]
# enabled = false
# key = "ctrl+grave"       # Ctrl/Alt/Shift + a key; the Win key is not allowed
# edge = "top"             # top | bottom — which screen edge it docks to
# height = 10              # grid rows; the width spans the work area
# autohide = true          # hide when the window loses focus
#
# A `[keybindings]` entry `close-quick` hides it from inside the window.

# ---------------------------------------------------------------------------
# Window size (CONFIG-011, WINDOW-001, WINDOW-011)
# ---------------------------------------------------------------------------
#
# [window]
# cols = 80
# rows = 24
# padding = { x = 4, y = 4 }   # grid inset; the tab bar spans full width

# ---------------------------------------------------------------------------
# Tab bar (CONFIG-012, TAB-011/015/022/023/024/025)
# ---------------------------------------------------------------------------
# As a table it carries the rest of the tab-bar options; `visible` is the same
# value as the plain `tab-bar` key above (use one form, not both).
#
# [tab-bar]
# visible = "auto"                 # always | auto | hidden
# placement = "top"                # top | bottom
# show-profiles = "auto"           # always | auto | never — prefix "name:"
# close-button = true              # the hover box (TAB-021)
# show-cwd = true                  # TAB-025: last directory of the OSC 7 cwd

# ---------------------------------------------------------------------------
# Font (CONFIG-004..006)
# ---------------------------------------------------------------------------
# As a table this is the same as the plain font keys (`font`, `font-size`, `line-height`,
# `font-features`). DPI comes from the app's PerMonitorV2 manifest, not config.
#
# [font]
# family = "Cascadia Mono"
# size = 11
# line-height = 1.25
# features = "calt,liga"
